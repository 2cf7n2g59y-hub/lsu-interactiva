<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Juegos | Aprendé LSU</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Shrikhand&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: #294C45;
      background-color: #E4EBC8;
    }


    /* BARRA */

    header {
      background-color: #285F55;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 8%;
    }

    .logo {
      color: #FFF8E7;

      font-size: 24px;
      font-weight: bold;
    }

    .logo::after {
      content: " ✦";
      color: #B84A3A;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      background-color: #9AABD0;
      color: white;

      text-decoration: none;

      padding: 10px 18px;

      border: 2px solid #FFF8E7;
      border-radius: 25px;

      font-size: 13px;

      transition: 0.2s;
    }

    nav a:hover {
      background-color: #B84A3A;
    }


    /* PÁGINA */

    main {
      min-height: calc(100vh - 70px);

      padding: 55px 20px 80px;

      text-align: center;

      background-color: #E4EBC8;

      background-image: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.25) 0px,
        rgba(255,255,255,0.25) 45px,
        transparent 45px,
        transparent 90px
      );
    }

    .mini-titulo {
      color: #B84A3A;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 2px;

      margin-bottom: 8px;
    }

    h1 {
      font-family: "Shrikhand", cursive;

      font-size: 52px;
      font-weight: normal;

      margin-bottom: 10px;
    }

    .descripcion {
      font-size: 17px;

      margin-bottom: 45px;
    }


    /* TARJETAS */

    .juegos {
      display: flex;
      justify-content: center;

      gap: 35px;

      flex-wrap: wrap;
    }

    .juego {
      width: 330px;
      min-height: 290px;

      background-color: #FFF8E7;

      border: 2px solid #285F55;
      border-radius: 28px;

      box-shadow: 7px 7px 0px #285F55;

      padding: 35px 28px;

      display: flex;
      flex-direction: column;
      align-items: center;

      transition: 0.2s;
    }

    .juego:hover {
      transform: translateY(-6px);
    }

    .icono {
      font-size: 55px;

      margin-bottom: 15px;
    }

    .juego h2 {
      font-family: "Shrikhand", cursive;

      font-weight: normal;
      font-size: 28px;

      color: #B84A3A;

      margin-bottom: 12px;
    }

    .juego p {
      line-height: 1.5;

      margin-bottom: 25px;
    }

    .juego a {
      margin-top: auto;

      background-color: #9AABD0;
      color: white;

      text-decoration: none;

      padding: 11px 24px;

      border-radius: 25px;

      font-size: 13px;
      font-weight: bold;

      transition: 0.2s;
    }

    .juego a:hover {
      background-color: #B84A3A;
    }


    @media (max-width: 700px) {

      header {
        flex-direction: column;
        gap: 15px;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      nav a {
        font-size: 11px;
        padding: 8px 12px;
      }

      h1 {
        font-size: 42px;
      }

      .juego {
        width: 90%;
        max-width: 350px;
      }

    }

  </style>

</head>


<body>

  <header>

    <div class="logo">
      Aprendé LSU
    </div>

    <nav>
      <a href="index.html">INICIO</a>
      <a href="abecedario.html">ABECEDARIO</a>
      <a href="camara.html">CÁMARA</a>
    </nav>

  </header>


  <main>

    <p class="mini-titulo">
      APRENDÉ JUGANDO
    </p>

    <h1>
      Elegí un juego
    </h1>

    <p class="descripcion">
      Practicá las letras y las señas de LSU.
    </p>


    <div class="juegos">

      <div class="juego">

        <div class="icono">
          ✎
        </div>

        <h2>
          Armá la palabra
        </h2>

        <p>
          Mirá la imagen y elegí las letras
          correctas para formar la palabra.
        </p>

        <a href="juego-palabras.html">
          JUGAR
        </a>

      </div>


      <div class="juego">

        <div class="icono">
          ✋
        </div>

        <h2>
          ¿Qué letra es?
        </h2>

        <p>
          Observá la seña y descubrí
          qué letra representa.
        </p>

        <a href="juego-letras.html">
          JUGAR
        </a>

      </div>

    </div>

  </main>

</body>

</html>
