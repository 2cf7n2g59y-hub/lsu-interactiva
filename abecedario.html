<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Abecedario LSU</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Shrikhand&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ============================= */
    /* AJUSTES GENERALES             */
    /* ============================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: #294C45;
      background-color: #E4EBC8;

      background-image: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.25) 0px,
        rgba(255, 255, 255, 0.25) 45px,
        transparent 45px,
        transparent 90px
      );
    }


    /* ============================= */
    /* MENÚ                          */
    /* ============================= */

    header {
      background-color: #285F55;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 8%;
    }

    .logo {
      color: #FFF8E7;

      font-size: 24px;
      font-weight: bold;
    }

    .logo::after {
      content: " ✦";
      color: #B84A3A;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      background-color: #9AABD0;
      color: white;

      text-decoration: none;

      padding: 10px 18px;

      border: 2px solid #FFF8E7;
      border-radius: 25px;

      font-size: 13px;

      transition: 0.2s;
    }

    nav a:hover {
      background-color: #B84A3A;
    }

    nav .activo {
      background-color: #B84A3A;
    }


    /* ============================= */
    /* TÍTULO                        */
    /* ============================= */

    .titulo {
      text-align: center;

      padding: 55px 20px 35px;
    }

    .titulo .estrella {
      color: #B84A3A;
      font-size: 34px;

      margin-bottom: 5px;
    }

    .titulo h1 {
      font-family: "Shrikhand", cursive;
      font-weight: normal;

      font-size: 52px;

      color: #285F55;

      margin-bottom: 10px;
    }

    .titulo h1 span {
      color: #B84A3A;
    }

    .titulo p {
      font-size: 17px;
      line-height: 1.5;

      max-width: 600px;

      margin: auto;
    }


    /* ============================= */
    /* ABECEDARIO                    */
    /* ============================= */

    .contenedor-abecedario {
      width: 90%;
      max-width: 1150px;

      margin: 0 auto 80px;
    }

    .abecedario {
      display: grid;

      grid-template-columns: repeat(5, 1fr);

      gap: 24px;
    }


.letra {
  background: transparent;
  padding: 0;
  border: none;
  box-shadow: none;
}

.letra img {
  width: 100%;
  height: auto;
  display: block;
}

    @media (max-width: 900px) {

      .abecedario {
        grid-template-columns: repeat(3, 1fr);
      }

    }

    @media (max-width: 700px) {

      header {
        flex-direction: column;

        gap: 15px;

        padding: 18px;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;

        gap: 8px;
      }

      nav a {
        padding: 8px 12px;

        font-size: 11px;
      }

      .titulo {
        padding-top: 40px;
      }

      .titulo h1 {
        font-size: 40px;
      }

      .titulo p {
        font-size: 15px;
      }

      .abecedario {
        grid-template-columns: repeat(2, 1fr);

        gap: 17px;
      }

      .letra {
        padding: 9px;

        border-radius: 18px;

        box-shadow: 4px 4px 0px #285F55;
      }

    }

  </style>

</head>
