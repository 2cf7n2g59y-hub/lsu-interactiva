<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Armá la palabra | Aprendé LSU</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Shrikhand&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: #294C45;
      background-color: #E4EBC8;
    }

    /* HEADER */

    header {
      background-color: #285F55;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 8%;
    }

    .logo {
      color: #FFF8E7;
      font-size: 24px;
      font-weight: bold;
    }

    .logo::after {
      content: " ✦";
      color: #B84A3A;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      background-color: #9AABD0;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border: 2px solid #FFF8E7;
      border-radius: 25px;
      font-size: 13px;
      transition: 0.2s;
    }

    nav a:hover {
      background-color: #B84A3A;
    }

    /* PÁGINA */

    main {
      min-height: calc(100vh - 70px);
      padding: 30px 20px 70px;
      text-align: center;

      background-color: #E4EBC8;

      background-image: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.25) 0px,
        rgba(255,255,255,0.25) 45px,
        transparent 45px,
        transparent 90px
      );
    }

    .parte-superior {
      width: min(850px, 95%);
      margin: 0 auto 18px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .volver {
      color: #285F55;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .puntos {
      background-color: #FFF8E7;

      border: 2px solid #285F55;
      border-radius: 20px;

      padding: 8px 17px;

      font-weight: bold;

      box-shadow: 4px 4px 0 #9AABD0;
    }

    .mini-titulo {
      color: #B84A3A;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    h1 {
      font-family: "Shrikhand", cursive;
      font-size: 43px;
      font-weight: normal;
      margin-bottom: 20px;
    }

    /* JUEGO */

    .juego {
      width: min(900px, 96%);
      margin: auto;

      background-color: #FFF8E7;

      border: 2px solid #285F55;
      border-radius: 30px;

      box-shadow: 8px 8px 0 #285F55;

      padding: 28px;
    }

    /* OBJETO */

    .imagen-objeto {
      width: 135px;
      height: 135px;

      margin: 0 auto 12px;

      background-color: #E4EBC8;

      border-radius: 25px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 75px;
    }

    .pregunta {
      font-size: 16px;
      margin-bottom: 22px;
    }

    /* PALABRA QUE SE VA ARMANDO */

    .palabra {
      min-height: 120px;

      display: flex;
      justify-content: center;
      align-items: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 25px;
    }

    .espacio {
      width: 76px;
      height: 100px;

      background-color: #FFFDF5;

      border: 2px dashed #9AABD0;
      border-radius: 13px;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .espacio img {
      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;

      display: block;
    }

    /* OPCIONES */

    .opciones {
      display: flex;
      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 18px;
    }

    .opcion-sena {
      width: 78px;
      height: 102px;

      padding: 0;

      background-color: #FFF8E7;

      border: 2px solid #9AABD0;
      border-radius: 13px;

      overflow: hidden;

      cursor: pointer;

      transition: 0.15s;
    }

    .opcion-sena img {
      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;

      display: block;

      margin: auto;
    }

    .opcion-sena:hover {
      transform: translateY(-4px);
    }

    .opcion-sena.usada {
      opacity: 0.25;
      cursor: default;
    }

    .opcion-sena.error {
      border-color: #B84A3A;
      box-shadow: 0 0 0 2px #B84A3A;
    }

    /* MENSAJE */

    #mensaje {
      min-height: 30px;

      color: #B84A3A;

      font-weight: bold;

      margin-bottom: 12px;
    }

    #siguiente {
      display: none;

      margin: auto;

      background-color: #B84A3A;
      color: #FFF8E7;

      border: none;
      border-radius: 25px;

      padding: 12px 25px;

      font-family: "DM Sans", sans-serif;
      font-weight: bold;

      cursor: pointer;
    }

    #siguiente:hover {
      background-color: #285F55;
    }

    /* FINAL */

    .final {
      display: none;
      padding: 35px 15px;
    }

    .final h2 {
      font-family: "Shrikhand", cursive;

      color: #B84A3A;

      font-size: 34px;
      font-weight: normal;

      margin-bottom: 12px;
    }

    .final p {
      font-size: 18px;
      margin-bottom: 22px;
    }

    .final button {
      background-color: #285F55;
      color: #FFF8E7;

      border: none;
      border-radius: 25px;

      padding: 12px 25px;

      font-family: "DM Sans", sans-serif;
      font-weight: bold;

      cursor: pointer;
    }

    /* CELULAR */

    @media (max-width: 700px) {

      header {
        flex-direction: column;
        gap: 15px;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      nav a {
        font-size: 11px;
        padding: 8px 12px;
      }

      .parte-superior {
        flex-direction: column;
        gap: 12px;
      }

      h1 {
        font-size: 35px;
      }

      .juego {
        padding: 20px 12px;
      }

      .espacio {
        width: 58px;
        height: 78px;
      }

      .opcion-sena {
        width: 61px;
        height: 82px;
      }

    }

  </style>
</head>


<body>

  <header>

    <div class="logo">
      Aprendé LSU
    </div>

    <nav>
      <a href="index.html">INICIO</a>
      <a href="abecedario.html">ABECEDARIO</a>
      <a href="juegos.html">JUEGOS</a>
      <a href="camara.html">CÁMARA</a>
    </nav>

  </header>


  <main>

    <div class="parte-superior">

      <a class="volver" href="juegos.html">
        ← VOLVER A JUEGOS
      </a>

      <div class="puntos">
        PUNTOS:
        <span id="puntos">0</span>
      </div>

    </div>


    <p class="mini-titulo">
      JUEGO
    </p>

    <h1>
      Armá la palabra
    </h1>


    <div class="juego">

      <div id="contenidoJuego">

        <div
          class="imagen-objeto"
          id="imagenObjeto"
        ></div>

        <p class="pregunta">
          Elegí las señas en el orden correcto.
        </p>

        <div
          class="palabra"
          id="palabra"
        ></div>

        <div
          class="opciones"
          id="opciones"
        ></div>

        <p id="mensaje"></p>

        <button
          id="siguiente"
          type="button"
        >
          SIGUIENTE PALABRA
        </button>

      </div>


      <div
        class="final"
        id="final"
      >

        <h2>
          ✦ ¡Terminaste! ✦
        </h2>

        <p>
          Hiciste
          <strong id="puntosFinales"></strong>
          puntos.
        </p>

        <button
          id="reiniciar"
          type="button"
        >
          JUGAR DE NUEVO
        </button>

      </div>

    </div>

  </main>


  <script>

    /* ========================= */
    /* PALABRAS                  */
    /* ========================= */

    const palabrasOriginales = [

      {
        palabra: "SILLA",
        imagen: "🪑"
      },

      {
        palabra: "TAZA",
        imagen: "☕"
      },

      {
        palabra: "TELEFONO",
        imagen: "📱"
      },

      {
        palabra: "PEZ",
        imagen: "🐟"
      },

      {
        palabra: "CUCHARA",
        imagen: "🥄"
      },

      {
        palabra: "MATE",
        imagen: "🧉"
      },

      {
        palabra: "PERRO",
        imagen: "🐶"
      },

      {
        palabra: "GORRO",
        imagen: "🧢"
      },

      {
        palabra: "BUZO",
        imagen: "👕"
      },

      {
        palabra: "CAMA",
        imagen: "🛏️"
      },

      {
        palabra: "PARAGUAS",
        imagen: "☂️"
      },

      {
        palabra: "VASO",
        imagen: "🥛"
      },

      {
        palabra: "PLANTA",
        imagen: "🌱"
      },

      {
        palabra: "GLOBO",
        imagen: "🎈"
      }

    ];


    /*
      LAS 30 SEÑAS DEL ALFABETO.

      CH, LL y RR son una unidad.
    */

    const alfabeto = [

      "A", "B", "C", "CH", "D",

      "E", "F", "G", "H", "I",

      "J", "K", "L", "LL", "M",

      "N", "Ñ", "O", "P", "Q",

      "R", "RR", "S", "T", "U",

      "V", "W", "X", "Y", "Z"

    ];


    /* ========================= */
    /* ELEMENTOS                 */
    /* ========================= */

    const imagenObjeto =
      document.getElementById("imagenObjeto");

    const palabraContenedor =
      document.getElementById("palabra");

    const opcionesContenedor =
      document.getElementById("opciones");

    const mensaje =
      document.getElementById("mensaje");

    const siguiente =
      document.getElementById("siguiente");

    const puntosTexto =
      document.getElementById("puntos");

    const contenidoJuego =
      document.getElementById("contenidoJuego");

    const final =
      document.getElementById("final");

    const puntosFinales =
      document.getElementById("puntosFinales");

    const reiniciar =
      document.getElementById("reiniciar");


    /* ========================= */
    /* VARIABLES                 */
    /* ========================= */

    let ronda = [];

    let indiceRonda = 0;

    let unidadesActuales = [];

    let posicionActual = 0;

    let puntos = 0;


    /* ========================= */
    /* MEZCLAR                   */
    /* ========================= */

    function mezclar(array) {

      const copia = [...array];

      for (
        let i = copia.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          copia[i],
          copia[j]
        ] = [
          copia[j],
          copia[i]
        ];

      }

      return copia;

    }


    /* ========================= */
    /* SEPARAR PALABRA EN LSU    */
    /* ========================= */

    function separarEnLetrasLSU(palabra) {

      const unidades = [];

      let i = 0;

      while (i < palabra.length) {

        const dosLetras =
          palabra.substring(i, i + 2);

        if (
          dosLetras === "CH" ||
          dosLetras === "LL" ||
          dosLetras === "RR"
        ) {

          unidades.push(dosLetras);

          i += 2;

        } else {

          unidades.push(
            palabra[i]
          );

          i++;

        }

      }

      return unidades;

    }


    /* ========================= */
    /* NOMBRE DEL ARCHIVO        */
    /* ========================= */

    function archivoLetra(letra) {

      if (letra === "Ñ") {
        return "ñ.jpeg";
      }

      return letra.toLowerCase() + ".jpeg";

    }


    /* ========================= */
    /* CREAR IMAGEN              */
    /* ========================= */

    function crearImagenSena(letra) {

      const img =
        document.createElement("img");

      img.src =
        "letras/" +
        archivoLetra(letra);

      img.alt =
        "Seña de " +
        letra;

      return img;

    }


    /* ========================= */
    /* INICIAR PARTIDA           */
    /* ========================= */

    function iniciarPartida() {

      /*
        Mezclamos todas las palabras.

        Así ninguna se repite
        durante la partida.
      */

      ronda =
        mezclar(palabrasOriginales).slice(0,5);

      indiceRonda = 0;

      puntos = 0;

      puntosTexto.textContent =
        puntos;

      final.style.display =
        "none";

      contenidoJuego.style.display =
        "block";

      nuevaPalabra();

    }


    /* ========================= */
    /* NUEVA PALABRA             */
    /* ========================= */

    function nuevaPalabra() {

      if (
        indiceRonda >= ronda.length
      ) {

        terminarPartida();

        return;

      }


      mensaje.textContent = "";

      siguiente.style.display =
        "none";

      palabraContenedor.innerHTML =
        "";

      opcionesContenedor.innerHTML =
        "";

      posicionActual = 0;


      const elegida =
        ronda[indiceRonda];


      /*
        ACÁ ESTÁ LA CORRECCIÓN
        IMPORTANTE.

        PERRO:
        P - E - RR - O

        CHICO:
        CH - I - C - O

        LLAVE:
        LL - A - V - E
      */

      unidadesActuales =
        separarEnLetrasLSU(
          elegida.palabra
        );


      imagenObjeto.textContent =
        elegida.imagen;


      /* ESPACIOS */

      unidadesActuales.forEach(
        () => {

          const espacio =
            document.createElement(
              "div"
            );

          espacio.className =
            "espacio";

          palabraContenedor.appendChild(
            espacio
          );

        }
      );


      /*
        LAS OPCIONES CORRECTAS
        SON LAS UNIDADES LSU.

        Si aparece RR,
        aparece rr.jpeg UNA VEZ.
      */

      let opciones =
        [...unidadesActuales];


      /*
        TRES SEÑAS TRAMPA
      */

      const letrasNoUsadas =

        alfabeto.filter(
          letra =>
            !unidadesActuales.includes(
              letra
            )
        );


      const trampas =

        mezclar(
          letrasNoUsadas
        ).slice(0, 3);


      opciones.push(
        ...trampas
      );


      opciones =
        mezclar(opciones);


      opciones.forEach(
        letra => {

          const boton =
            document.createElement(
              "button"
            );

          boton.className =
            "opcion-sena";

          boton.type =
            "button";

          boton.appendChild(
            crearImagenSena(letra)
          );

          boton.addEventListener(
            "click",
            () => elegirSena(
              boton,
              letra
            )
          );

          opcionesContenedor.appendChild(
            boton
          );

        }
      );

    }


    /* ========================= */
    /* ELEGIR SEÑA               */
    /* ========================= */

    function elegirSena(
      boton,
      letra
    ) {

      if (boton.disabled) {
        return;
      }


      const letraEsperada =
        unidadesActuales[
          posicionActual
        ];


      if (
        letra === letraEsperada
      ) {

        const espacios =
          document.querySelectorAll(
            ".espacio"
          );


        espacios[
          posicionActual
        ].appendChild(
          crearImagenSena(letra)
        );


        posicionActual++;


        boton.disabled = true;

        boton.classList.add(
          "usada"
        );


        mensaje.textContent =
          "";


        if (
          posicionActual ===
          unidadesActuales.length
        ) {

          puntos++;

          puntosTexto.textContent =
            puntos;

          mensaje.textContent =
            "✦ ¡MUY BIEN! +1 PUNTO ✦";

          siguiente.style.display =
            "block";

        }

      } else {

        boton.classList.add(
          "error"
        );

        mensaje.textContent =
          "Probá otra seña";

        setTimeout(
          () => {

            boton.classList.remove(
              "error"
            );

          },
          500
        );

      }

    }


    /* ========================= */
    /* SIGUIENTE                 */
    /* ========================= */

    siguiente.addEventListener(
      "click",
      () => {

        indiceRonda++;

        nuevaPalabra();

      }
    );


    /* ========================= */
    /* FINAL                     */
    /* ========================= */

    function terminarPartida() {

      contenidoJuego.style.display =
        "none";

      final.style.display =
        "block";

      puntosFinales.textContent =
        puntos +
        " de " +
        ronda.length;

    }


    reiniciar.addEventListener(
      "click",
      iniciarPartida
    );


    iniciarPartida();

  </script>

</body>

</html>
